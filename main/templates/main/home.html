<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            color: #d63384;
            font-size: 36px;
        }

        p {
            color: #8a3d5c;
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .btn:hover {
            background-color: #d63384;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #8a3d5c;
            background: rgba(255,255,255,0.3);
            margin-top: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌸 Welcome to the Student Management System 🌸</h1>

        <p> 🌸 View Student Records. 🌸</p>

        <a href="/students/" class="btn">View Students 💗</a>
    </div>
    <footer>
        © 2026 Student Management System
        © Lester Genton
    </footer>
</body>
</html>
